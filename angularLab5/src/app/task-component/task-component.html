<td class="td">{{ task.title }}</td>
<td class="td">{{ task.createdBy }}</td>
<td class="td">{{ task.id }}</td>
<td class="td">{{ task.createdAt | date:'dd.MM.yyyy HH:mm' }}</td>
<td class="td">
  <span class="status" [attr.data-status]="[`${task.status}`]"></span>
</td>
<td class="actions">
  <button class="edit-btn" [routerLink]="[`${task.id}`]">Изменить</button>
  <button class="delete-btn" (click)="onDelete()">Удалить</button>
</td>
